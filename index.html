<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gefina — Faturas</title>
</head>

<body>
    <h1>Faturas</h1>

    <table>
        <thead>
            <tr>
                <td>Cliente</td>
                <td>Valor</td>
                <td>Data de Emissão</td>
                <td>Data de Vencimento</td>
                <td>Situação</td>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <script>
        const invoices = [
            {
                id: 1,
                amount: 125000,
                status: 'pending',
                issueDate: '2026-06-01',
                dueDate: '2026-06-15',
                customer: { id: 1, name: 'Construtora Meridiano', email: 'contato@meridiano.com.br' },
            },
            {
                id: 2,
                amount: 348000,
                status: 'paid',
                issueDate: '2026-05-12',
                dueDate: '2026-06-11',
                customer: { id: 1, name: 'Construtora Meridiano', email: 'contato@meridiano.com.br' },
            },
            {
                id: 3,
                amount: 96500,
                status: 'pending',
                issueDate: '2026-06-20',
                dueDate: '2026-07-20',
                customer: { id: 2, name: 'Gráfica Aurora', email: 'contato@graficaaurora.com.br' },
            },
        ];

        const tbody = document.querySelector('tbody');

        const translate = {
            pending: 'Pendente',
            paid: 'Pago'
        }

        for (let i = 0; i < invoices.length; i++) {
            const invoice = invoices[i];
            const row = document.createElement('tr');

            row.innerHTML =
                '<td>' + invoice.customer.name + '</td>' +
                '<td>R$ ' + (invoice.amount).toFixed(2) + '</td>' +
                '<td>' + invoice.issueDate + '</td>' +
                '<td>' + invoice.dueDate + '</td>' +
                '<td>' + translate[invoice.status] + '</td>';

            tbody.appendChild(row);
        }

    </script>
</body>

</html>
